<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="styles.css" rel="stylesheet" />
</helmet>
<main class="avde-main">
  <div onClick="{{ back }}" class="avde-back">&lt;&lt; Volver al Vault</div>
  <div class="avde-grid">
    <section class="avde-col">
      <div class="avde-cab">
        <div class="avde-screen">
          <canvas ref="{{ previewRef }}" class="avde-canvas"></canvas>
          <div class="avde-scan"></div>
          <div class="avde-vignette"></div>
          <div class="avde-badge">PREVISUALIZACIÓN</div>
        </div>
      </div>
      <h1 class="avde-title">{{ title }}</h1>
      <div class="avde-tags">
        <span class="avde-tag avde-tag--pink">{{ category }}</span>
        <span class="avde-tag avde-tag--yellow">MEJOR: {{ best }}</span>
      </div>
      <p class="avde-desc">{{ long }}</p>
      <div class="avde-actions">
        <div onClick="{{ play }}" class="avde-play">JUGAR AHORA</div>
        <div onClick="{{ back }}" class="avde-back-btn">VOLVER AL VAULT</div>
      </div>
    </section>

    <aside class="avde-board">
      <div class="avde-board-head">MEJORES PUNTUACIONES</div>
      <div class="avde-board-body">
        <sc-for list="{{ scores }}" as="s" hint-placeholder-count="10">
          <div class="avde-row" style="animation-delay: {{ s.delay }};">
            <span class="avde-rank" style="color: {{ s.rankColor }};">{{ s.rank }}</span>
            <span class="avde-name">{{ s.name }}</span>
            <span class="avde-score">{{ s.score }}</span>
          </div>
        </sc-for>
      </div>
    </aside>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;gameId&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;stored&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onPlay&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.poll = setInterval(() => {
      if (window.AVData && window.AVScores && window.AVEngine) { clearInterval(this.poll); this.mountDemo(); this.forceUpdate(); }
    }, 60);
  }
  componentWillUnmount() {
    clearInterval(this.poll);
    if (this.demo) this.demo.stop();
  }

  previewRef = (el) => {
    this.canvas = el;
    if (!el && this.demo) { this.demo.stop(); this.demo = null; return; }
    this.mountDemo();
  };

  mountDemo() {
    if (!this.canvas || !window.AVEngine) return;
    if (this.demo) this.demo.stop();
    this.demo = new window.AVEngine.Demo(this.canvas);
  }

  renderVals() {
    const D = window.AVData, S = window.AVScores;
    const base = {
      previewRef: this.previewRef,
      play: () => this.props.onPlay && this.props.onPlay(),
      back: () => this.props.onBack && this.props.onBack()
    };
    if (!D || !S) return Object.assign(base, { scores: [] });
    const g = D.byId(this.props.gameId);
    const stored = this.props.stored || {};
    return Object.assign(base, {
      title: g.title, category: g.category, long: g.long, best: S.best(stored, g.id),
      scores: S.board(stored, g.id).map((r, i) => ({
        rank: '#' + (i + 1), name: r.name, score: r.score.toLocaleString('es-ES'),
        rankColor: S.rankColor(i), delay: (i * 45) + 'ms'
      }))
    });
  }
}

</script>
</body>
</html>
