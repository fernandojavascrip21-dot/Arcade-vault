<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="styles.css" rel="stylesheet" />
</helmet>
<main class="avha-main">
  <h1 class="avha-title">SALÓN DE LA FAMA</h1>
  <p class="avha-sub">Las diez mejores marcas de cada máquina</p>

  <div class="avha-tabs">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
      <div onClick="{{ t.select }}" class="avha-tab" style="border-color: {{ t.border }}; color: {{ t.color }}; background: {{ t.bg }};">{{ t.title }}</div>
    </sc-for>
  </div>

  <div class="avha-table-wrap">
    <div class="avha-table">
      <div class="avha-head">
        <span>RANGO</span><span>JUGADOR</span><span class="avha-r">PUNTUACIÓN</span><span class="avha-r">FECHA</span>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
        <div class="avha-row" style="background: {{ r.rowBg }}; animation-delay: {{ r.delay }};">
          <span class="avha-rank" style="color: {{ r.rankColor }}; text-shadow: {{ r.rankGlow }};">{{ r.rank }}</span>
          <span class="avha-name">{{ r.name }}
            <sc-if value="{{ r.isYou }}" hint-placeholder-val="{{ false }}">
              <span class="avha-you">TU MEJOR MARCA</span>
            </sc-if>
          </span>
          <span class="avha-score">{{ r.score }}</span>
          <span class="avha-date">{{ r.date }}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <p class="avha-note">// Puntuaciones de invitado en localStorage. Las cuentas autenticadas leerían el ranking global desde la API.</p>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;stored&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;gameId&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;playerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;INVITADO&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tab: null };

  componentDidMount() {
    this.poll = setInterval(() => {
      if (window.AVData && window.AVScores) { clearInterval(this.poll); this.forceUpdate(); }
    }, 60);
  }
  componentWillUnmount() { clearInterval(this.poll); }

  renderVals() {
    const D = window.AVData, S = window.AVScores;
    if (!D || !S) return { tabs: [], rows: [] };
    const tab = this.state.tab || this.props.gameId || D.GAMES[0].id;
    const stored = this.props.stored || {};
    const me = this.props.playerName || 'INVITADO';
    return {
      tabs: D.GAMES.map(g => ({
        title: g.title,
        select: () => this.setState({ tab: g.id }),
        border: tab === g.id ? '#00f5ff' : 'rgba(255,255,255,.14)',
        color: tab === g.id ? '#00f5ff' : '#8b98a3',
        bg: tab === g.id ? 'rgba(255,255,255,.06)' : 'transparent'
      })),
      rows: S.board(stored, tab).map((r, i) => ({
        rank: String(i + 1).padStart(2, '0'),
        name: r.name,
        score: r.score.toLocaleString('es-ES'),
        date: r.date,
        rankColor: S.rankColor(i),
        rankGlow: i < 3 ? '0 0 14px ' + S.rankColor(i) : 'none',
        rowBg: r.mine && r.name === me ? 'rgba(255,0,110,.10)' : i < 3 ? 'rgba(245,255,0,.04)' : 'transparent',
        isYou: r.mine && r.name === me,
        delay: (i * 60) + 'ms'
      }))
    };
  }
}

</script>
</body>
</html>
