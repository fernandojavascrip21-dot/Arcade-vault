<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="styles.css" rel="stylesheet" />
</helmet>
<main class="avli-main">
  <header class="avli-header">
    <h1 class="avli-title">ARCADE<br /><span class="avli-title-vault">VAULT</span></h1>
    <p class="avli-tagline">Inserta una moneda para jugar</p>
    <div class="avli-search-wrap">
      <input value="{{ query }}" onChange="{{ onQuery }}" placeholder="Buscar juego por nombre..." class="avli-search" />
    </div>
    <div class="avli-cats">
      <sc-for list="{{ categories }}" as="c" hint-placeholder-count="5">
        <div onClick="{{ c.select }}" class="avli-cat" style="border-color: {{ c.border }}; color: {{ c.color }}; background: {{ c.bg }};">{{ c.label }}</div>
      </sc-for>
    </div>
  </header>

  <div class="avli-grid">
    <sc-for list="{{ games }}" as="g" hint-placeholder-count="6">
      <article onClick="{{ g.open }}" class="avli-card">
        <div class="avli-thumb" style="background: {{ g.thumb }};">
          <div class="avli-thumb-hatch"></div>
          <div class="avli-thumb-label">carátula</div>
          <div class="avli-thumb-cat">{{ g.category }}</div>
        </div>
        <div class="avli-body">
          <h3 class="avli-card-title">{{ g.title }}</h3>
          <p class="avli-card-desc">{{ g.desc }}</p>
          <div class="avli-best">
            <span class="avli-best-label">Mejor puntuación</span>
            <span class="avli-best-value">{{ g.best }}</span>
          </div>
          <div class="avli-play">JUGAR</div>
        </div>
      </article>
    </sc-for>
  </div>

  <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
    <div class="avli-empty">NINGÚN JUEGO COINCIDE CON LA BÚSQUEDA</div>
  </sc-if>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;stored&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, {name:string,score:number,date:string}[]&gt;&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(gameId: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { query: '', cat: 'Todos' };

  componentDidMount() {
    this.poll = setInterval(() => {
      if (window.AVData && window.AVScores) { clearInterval(this.poll); this.forceUpdate(); }
    }, 60);
  }
  componentWillUnmount() { clearInterval(this.poll); }

  renderVals() {
    const D = window.AVData, S = window.AVScores;
    if (!D || !S) return { games: [], categories: [], query: this.state.query, noResults: false };
    const stored = this.props.stored || {};
    const q = this.state.query.trim().toLowerCase();
    const games = D.GAMES
      .filter(g => (this.state.cat === 'Todos' || g.category === this.state.cat) && (!q || g.title.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q)))
      .map(g => Object.assign({}, g, {
        best: S.best(stored, g.id),
        open: () => this.props.onOpen && this.props.onOpen(g.id)
      }));
    return {
      query: this.state.query,
      onQuery: e => this.setState({ query: e.target.value }),
      categories: D.CATEGORIES.map(c => ({
        label: c,
        select: () => this.setState({ cat: c }),
        border: this.state.cat === c ? '#00f5ff' : 'rgba(255,255,255,.14)',
        color: this.state.cat === c ? '#00f5ff' : '#8b98a3',
        bg: this.state.cat === c ? 'rgba(255,255,255,.06)' : 'transparent'
      })),
      games: games,
      noResults: games.length === 0
    };
  }
}

</script>
</body>
</html>
