<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="styles.css" rel="stylesheet" />
</helmet>
<main class="avau-main">
  <div class="avau-card">
    <div class="avau-brand">ARCADE<span class="avau-brand-vault">VAULT</span></div>
    <div class="avau-tabs">
      <div onClick="{{ tabLogin }}" class="avau-tab" style="color: {{ loginColor }}; background: {{ loginBg }};">INICIAR SESIÓN</div>
      <div onClick="{{ tabRegister }}" class="avau-tab" style="color: {{ registerColor }}; background: {{ registerBg }};">CREAR CUENTA</div>
    </div>
    <div class="avau-fields">
      <label class="avau-label">Usuario
        <input value="{{ user }}" onChange="{{ onUser }}" placeholder="jugador_01" class="avau-input" />
      </label>
      <sc-if value="{{ registering }}" hint-placeholder-val="{{ false }}">
        <label class="avau-label">Correo electrónico
          <input placeholder="tu@correo.com" class="avau-input" />
        </label>
      </sc-if>
      <label class="avau-label">Contraseña
        <input type="password" placeholder="••••••••" class="avau-input" />
      </label>
    </div>
    <div onClick="{{ submit }}" class="avau-submit">{{ action }}</div>
    <div onClick="{{ guest }}" class="avau-guest">Jugar como invitado</div>
    <div class="avau-divider">
      <div class="avau-divider-line"></div><span class="avau-divider-text">O CONTINÚA CON</span><div class="avau-divider-line"></div>
    </div>
    <div class="avau-oauth">
      <div onClick="{{ submit }}" class="avau-oauth-btn">Google</div>
      <div onClick="{{ submit }}" class="avau-oauth-btn">GitHub</div>
    </div>
    <p class="avau-note">// Demo local. Aquí conectaría el backend real (REST o Supabase) para sesiones y puntuaciones sincronizadas.</p>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;onLogin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(name: string) =&gt; void&quot;},&quot;onGuest&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { tab: 'login', user: '' };

  submit = () => {
    const name = (this.state.user || 'JUGADOR_01').toUpperCase().slice(0, 14);
    if (this.props.onLogin) this.props.onLogin(name);
  };

  renderVals() {
    const reg = this.state.tab === 'register';
    return {
      registering: reg,
      action: reg ? 'CREAR CUENTA' : 'ENTRAR AL VAULT',
      tabLogin: () => this.setState({ tab: 'login' }),
      tabRegister: () => this.setState({ tab: 'register' }),
      loginColor: reg ? '#6f7d88' : '#00f5ff',
      loginBg: reg ? 'transparent' : 'rgba(0,245,255,.12)',
      registerColor: reg ? '#ff006e' : '#6f7d88',
      registerBg: reg ? 'rgba(255,0,110,.12)' : 'transparent',
      user: this.state.user,
      onUser: e => this.setState({ user: e.target.value }),
      submit: this.submit,
      guest: () => this.props.onGuest && this.props.onGuest()
    };
  }
}

</script>
</body>
</html>
